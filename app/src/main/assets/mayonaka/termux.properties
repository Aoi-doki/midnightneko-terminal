### Mayonaka (真夜中) defaults.
###
### Written to ~/.termux/termux.properties on first run if that file does not already exist.
### Mayonaka never overwrites a properties file you have edited yourself; edit this file freely
### and reload it from the terminal long-press menu ("More" -> "Reload settings") or from
### Settings -> Mayonaka.

### Extra keys ############################################################################
#
# Two rows by default. The third symbol row is toggled from Settings -> Mayonaka -> Extra keys
# rows, which rewrites the extra-keys property below.
#
# Row 1: ESC | / HOME UP END PGUP DEL
# Row 2: TAB CTRL ALT LEFT DOWN RIGHT PGDN BKSP

extra-keys = [ \
 ['ESC','|','/','HOME','UP','END','PGUP','DEL'], \
 ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN','BKSP'] \
]

# Which glyph set the key captions use: default, arrows-only, arrows-all, all, none.
# (The bordered-chip *look* is a Mayonaka setting, not a termux.properties one --
#  see Settings -> Mayonaka -> Keyboard style.)
extra-keys-style = default

# Keep the key captions upper case.
extra-keys-text-all-caps = true

### Terminal ##############################################################################

terminal-cursor-style = bar
terminal-cursor-blink-rate = 600

terminal-margin-horizontal = 4
terminal-margin-vertical = 0

terminal-transcript-rows = 8000

# Slightly taller toolbar so the bordered chips have room to breathe.
terminal-toolbar-height = 1.15

### Behaviour #############################################################################

# The bell is a vibration, never a beep.
bell-character = vibrate

# Back key sends escape; use the gesture/nav bar to actually leave.
back-key = escape

# Volume down + key = ctrl-key chords.
volume-keys = volume

# Long-press URLs to open them.
terminal-onclick-url-open = true

# Mayonaka is midnight in both day and night mode.
use-black-ui = true
night-mode = true

fullscreen = false

### Keyboard shortcuts ####################################################################

shortcut.create-session = ctrl + t
shortcut.next-session = ctrl + 2
shortcut.previous-session = ctrl + 1
shortcut.rename-session = ctrl + n
