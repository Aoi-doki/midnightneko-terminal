plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "com.google.devtools.ksp"
    id "io.github.takahirom.roborazzi"
}

android {
    namespace "dev.aoidoki.arise"
    compileSdk 36

    defaultConfig {
        applicationId "dev.aoidoki.arise"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        // CI stamps these from the release tag so every published build installs over the last.
        def envName = System.getenv("ARISE_VERSION_NAME") ?: ""
        def envCode = System.getenv("ARISE_VERSION_CODE") ?: ""
        if (envName) versionName = envName
        if (envCode) versionCode = envCode.toInteger()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // Committed on purpose, like mayonaka.jks at the repo root: a stable key means every build
        // installs over the previous one instead of forcing an uninstall that wipes your progress.
        arise {
            storeFile rootProject.file("arise.jks")
            storePassword "arisesystem"
            keyAlias "arise"
            keyPassword "arisesystem"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.arise
            ndk { abiFilters "arm64-v8a" }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            signingConfig signingConfigs.arise
            // x86_64 so the CI emulator can run it.
            ndk { abiFilters "arm64-v8a", "x86_64" }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}", "/META-INF/INDEX.LIST", "/META-INF/DEPENDENCIES"]
        }
        jniLibs {
            useLegacyPackaging false
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources true
            all {
                systemProperty "robolectric.graphicsMode", "NATIVE"
                systemProperty "robolectric.pixelCopyRenderMode", "hardware"
            }
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
        disable += ["MissingTranslation", "ObsoleteLintCustomCheck", "GradleDependency", "NewerVersionAvailable", "AndroidGradlePluginVersion"]
    }
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        freeCompilerArgs.addAll(["-opt-in=kotlin.RequiresOptIn"])
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

roborazzi {
    outputDir.set(file("src/test/screenshots"))
}

