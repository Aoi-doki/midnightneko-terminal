    implementation "androidx.camera:camera-view:1.5.1"
    implementation "com.google.mlkit:pose-detection:18.0.0-beta5"

    implementation "com.google.mediapipe:tasks-genai:0.10.27"

    testImplementation "junit:junit:4.13.2"
