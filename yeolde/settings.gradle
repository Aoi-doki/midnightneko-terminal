pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "yeolde"
include ":app"
// Ye Olde Keys is a standalone project: it is deliberately not part of the Mayonaka (Termux) build
// at the repository root, so neither can break the other.
