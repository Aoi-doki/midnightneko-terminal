name: build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Release APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify the APK
        id: build
        uses: ./.github/actions/build-apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: mayonaka-apk
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error

      - name: Upload the mapping and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/mapping/**
          if-no-files-found: ignore
